name = "crateship-public-asset-cleanup"
main = "index.js"
compatibility_date = "2026-05-19"

[vars]
CRATE_PUBLIC_ASSET_CLEANUP_DELETE = "false"
CRATE_PUBLIC_ASSET_CLEANUP_LIMIT = "200"

[triggers]
crons = ["17 9 * * *"]

[[kv_namespaces]]
binding = "CRATE_GAMES"
id = "cfd1bca8ac84439cadc2bb146a034d41"

[[d1_databases]]
binding = "CRATE_AUDIT"
database_name = "crateship-games-audit"
database_id = "9cbee4e4-caa7-43fb-bbb7-9f0f7d7e2b9a"

[[r2_buckets]]
binding = "CRATE_USER_ASSETS"
bucket_name = "crateship-games-user-assets"
