# Daily housekeeping: private model files queued for deletion, finished visit days, expired sessions, tokens,
# rate-limit rows and AI-connection leftovers. Every step is capped per run (platform/server/maintenance.mjs).
# No public HTTP surface.
# Deploy: npx wrangler deploy --config worker/engine-maintenance/wrangler.toml
name = "crateship-engine-maintenance"
main = "index.mjs"
compatibility_date = "2026-05-19"
workers_dev = false
preview_urls = false

[triggers]
crons = ["17 3 * * *"]   # 03:17 UTC every day

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "crateship-platform-v1"
database_id = "be31584e-bd51-46b6-b935-a794097d2e12"

[[r2_buckets]]
binding = "ENGINE_ASSETS"
bucket_name = "crateship-games-user-assets"
