<!DOCTYPE html>
<html>
<head><title>NPC Generator</title></head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

const loader = new GLTFLoader();

// 50 NPC variations: skin tones, outfit colors, types
const NPC_DEFS = [
  // Skin tones (hex)
  // Light: 0xFFDBAC, Medium: 0xD4A373, Brown: 0x8D5524, Dark: 0x4A2912, Olive: 0xC68642
  
  // Format: { name, skin, shirt, pants, shoes, hair, hairColor }
];

// Generate 50 variations
const skins = [0xFFDBAC, 0xF1C27D, 0xD4A373, 0xC68642, 0x8D5524, 0x6B3A2A, 0x4A2912, 0xE0AC69, 0xBE8C63, 0xA0522D];
const shirts = [0x2C3E50, 0xE74C3C, 0x3498DB, 0x27AE60, 0xF39C12, 0x8E44AD, 0x1ABC9C, 0xD35400, 0x2980B9, 0xC0392B,
                0x16A085, 0xF1C40F, 0x7F8C8D, 0x2ECC71, 0x9B59B6, 0xE67E22, 0x34495E, 0x1F618D, 0x6C3483, 0xA93226];
const pants = [0x2C3E50, 0x1A1A2E, 0x4A4A4A, 0x2F4F4F, 0x191970, 0x3B3B3B, 0x556B2F, 0x8B4513, 0x696969, 0x483D8B];
const shoes = [0x1A1A1A, 0x3D2B1F, 0x4A4A4A, 0x8B4513, 0x2F4F4F];
const hairColors = [0x1A1A1A, 0x3B2219, 0x6B3A2A, 0xB8860B, 0xDAA520, 0xA0522D, 0x808080, 0xD2691E, 0x2F1B14, 0x4A0404];

for (let i = 0; i < 50; i++) {
  NPC_DEFS.push({
    name: `npc_person_${String(i+1).padStart(2,'0')}`,
    skin: skins[i % skins.length],
    shirt: shirts[i % shirts.length],
    pants: pants[i % pants.length],
    shoes: shoes[i % shoes.length],
    hairColor: hairColors[i % hairColors.length],
  });
}

loader.load('models/anim_idle.glb', async (gltf) => {
  const exporter = new GLTFExporter();
  const scene = gltf.scene;
  
  // Analyze the Soldier's mesh structure
  const meshInfo = [];
  scene.traverse(node => {
    if (node.isMesh || node.isSkinnedMesh) {
      meshInfo.push({
        name: node.name,
        type: node.type,
        materialName: node.material ? node.material.name : 'none',
        color: node.material && node.material.color ? '#' + node.material.color.getHexString() : 'none',
        vertexCount: node.geometry ? node.geometry.attributes.position.count : 0
      });
    }
  });
  
  document.body.innerHTML = '<pre>' + JSON.stringify(meshInfo, null, 2) + '</pre>';
  document.body.innerHTML += '<br>Animations: ' + gltf.animations.map(a => a.name).join(', ');
  document.body.innerHTML += '<br>Total NPC defs: ' + NPC_DEFS.length;
  
  // Now generate each NPC
  let generated = 0;
  for (const def of NPC_DEFS) {
    const clone = scene.clone(true);
    
    // Recolor the clone's materials
    clone.traverse(node => {
      if ((node.isMesh || node.isSkinnedMesh) && node.material) {
        node.material = node.material.clone();
        // The Soldier has a single material — we'll tint it
        // For real variety we'd need to know which parts are skin/clothes
        // For now, apply a hue shift
        const hue = (def.shirt >> 16 & 0xFF) / 255;
        node.material.color.setHex(def.shirt);
      }
    });
    
    generated++;
  }
  
  document.body.innerHTML += '<br>Generated: ' + generated;
});
</script>
</body>
</html>
