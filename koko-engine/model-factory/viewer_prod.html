<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>HQ Models</title>
<style>
body{margin:0;background:#0a0a14;font-family:system-ui;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:16px;max-width:1100px;margin:auto}
.card{background:#12121e;border-radius:10px;overflow:hidden;border:1px solid #222}
.card canvas{width:100%;height:280px;display:block;background:#0a0a14}
.card .label{padding:8px 12px;font-size:14px;color:#e94560;font-weight:600}
.card .meta{padding:0 12px 8px;font-size:11px;color:#555}
h1{text-align:center;padding:20px 0 0;color:#e94560;font-size:24px}
p.sub{text-align:center;color:#555;margin:0 0 4px;font-size:13px}
.nav{text-align:center;padding:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.nav button{background:#1a1a2e;color:#e94560;border:1px solid #e94560;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.nav button.active{background:#e94560;color:#fff}
</style></head><body>
<h1>⚔️ Crate Engine HQ Models — 40 Categories</h1>
<p class="sub">Blender 5 • Subdivision • PBR Materials</p>
<div class="nav" id="nav"></div>
<div class="grid" id="grid"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"}}</script>
<script type="module">
import*as THREE from'three';
import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
import{OrbitControls}from'three/addons/controls/OrbitControls.js';

const resp=await fetch('output_hq_prod/manifest.json');
const manifest=await resp.json();

// Group by category
const cats={};
for(const m of manifest){
  const key=m.category;
  if(!cats[key])cats[key]=[];
  // One per subcategory per category
  if(!cats[key].find(x=>x.subcategory===m.subcategory))cats[key].push(m);
}

const nav=document.getElementById('nav');
const grid=document.getElementById('grid');
const loader=new GLTFLoader();
let animFrames=[];

function showCategory(catName){
  // Clean up
  animFrames.forEach(id=>cancelAnimationFrame(id));
  animFrames=[];
  grid.innerHTML='';
  
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.textContent===catName));
  
  const items=catName==='ALL'?Object.values(cats).flat():cats[catName]||[];
  
  for(const m of items){
    const card=document.createElement('div');card.className='card';
    const cvs=document.createElement('canvas');cvs.width=600;cvs.height=560;
    const label=document.createElement('div');label.className='label';label.textContent=m.name;
    const meta=document.createElement('div');meta.className='meta';
    meta.textContent=m.category+'/'+m.subcategory+' • '+(m.size/1024).toFixed(0)+'KB';
    card.append(cvs,label,meta);grid.append(card);
    
    const renderer=new THREE.WebGLRenderer({canvas:cvs,antialias:true});
    renderer.setPixelRatio(2);renderer.setSize(300,280);
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.3;
    const scene=new THREE.Scene();
    scene.background=new THREE.Color(0x0a0a14);
    scene.add(new THREE.AmbientLight(0xffffff,0.5));
    const key=new THREE.DirectionalLight(0xffeedd,1.5);key.position.set(3,5,3);scene.add(key);
    scene.add(new THREE.DirectionalLight(0x4488cc,0.5).position.set(-3,2,-2)||scene.children[scene.children.length-1]);
    const dl2=new THREE.DirectionalLight(0x4488cc,0.5);dl2.position.set(-3,2,-2);scene.add(dl2);
    const dl3=new THREE.DirectionalLight(0xff6633,0.3);dl3.position.set(0,-1,4);scene.add(dl3);
    
    const cam=new THREE.PerspectiveCamera(35,300/280,0.001,1000);
    const ctrl=new OrbitControls(cam,cvs);
    ctrl.enableDamping=true;ctrl.autoRotate=true;ctrl.autoRotateSpeed=2.5;
    
    loader.load('output_hq_prod/'+m.file,(gltf)=>{
      const obj=gltf.scene;
      const box=new THREE.Box3().setFromObject(obj);
      const sz=box.getSize(new THREE.Vector3());
      const center=box.getCenter(new THREE.Vector3());
      obj.position.set(-center.x,-center.y,-center.z);
      scene.add(obj);
      const maxDim=Math.max(sz.x,sz.y,sz.z)||1;
      const fov=cam.fov*(Math.PI/180);
      const dist=maxDim/(2*Math.tan(fov/2))*1.8;
      cam.position.set(dist*0.7,dist*0.55,dist*0.7);
      cam.near=dist*0.005;cam.far=dist*50;
      cam.updateProjectionMatrix();
      ctrl.target.set(0,0,0);ctrl.update();
    },undefined,()=>{label.textContent+=' ❌';});
    
    let id;
    (function anim(){id=requestAnimationFrame(anim);ctrl.update();renderer.render(scene,cam);})();
    animFrames.push(id);
  }
}

// Build nav
const allBtn=document.createElement('button');allBtn.textContent='ALL';
allBtn.onclick=()=>showCategory('ALL');nav.append(allBtn);
for(const cat of Object.keys(cats).sort()){
  const btn=document.createElement('button');
  btn.textContent=cat;
  btn.onclick=()=>showCategory(cat);
  nav.append(btn);
}

// Start with weapons (small set, fits in WebGL limit)
showCategory('weapons');
</script></body></html>
