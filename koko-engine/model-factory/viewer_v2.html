<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Model Viewer v2</title>
<style>
body{margin:0;background:#1a1a2e;font-family:system-ui;color:#fff;overflow-x:hidden}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;padding:20px}
.card{background:#16213e;border-radius:12px;overflow:hidden;border:1px solid #0f3460}
.card canvas{width:100%;height:220px;display:block}
.card .label{padding:10px;font-size:13px;text-align:center;color:#e94560}
h1{text-align:center;padding:20px 0 0;color:#e94560}
p{text-align:center;color:#888;margin:0 0 10px}
</style>
</head><body>
<h1>🏭 Crate Engine Model Factory v2 — Blender Quality</h1>
<p>Beveled, subdivided, proper materials — sample below</p>
<div class="grid" id="grid"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"}}</script>
<script type="module">
import*as THREE from'three';
import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
import{OrbitControls}from'three/addons/controls/OrbitControls.js';

const models=[
  {
    "path": "output_v2/armor/helmets/iron-helmet-0002.glb",
    "name": "Iron Helmet"
  },
  {
    "path": "output_v2/buildings/houses/elegant-house-0002.glb",
    "name": "Elegant House"
  },
  {
    "path": "output_v2/buildings/towers/iron-tower-0002.glb",
    "name": "Iron Tower"
  },
  {
    "path": "output_v2/dungeon/crystals/rustic-crystal-0000.glb",
    "name": "Rustic Crystal"
  },
  {
    "path": "output_v2/dungeon/pillars/mystic-pillar-0002.glb",
    "name": "Mystic Pillar"
  },
  {
    "path": "output_v2/furniture/bookshelves/shadow-bookshelve-0002.glb",
    "name": "Shadow Bookshelve"
  },
  {
    "path": "output_v2/furniture/chairs/rustic-chair-0001.glb",
    "name": "Rustic Chair"
  },
  {
    "path": "output_v2/furniture/tables/crystal-table-0000.glb",
    "name": "Crystal Table"
  },
  {
    "path": "output_v2/items/chests/frost-chest-0002.glb",
    "name": "Frost Chest"
  },
  {
    "path": "output_v2/items/gems/golden-gem-0002.glb",
    "name": "Golden Gem"
  },
  {
    "path": "output_v2/items/potions/battle-potion-0001.glb",
    "name": "Battle Potion"
  },
  {
    "path": "output_v2/nature/rocks/silver-rock-0001.glb",
    "name": "Silver Rock"
  },
  {
    "path": "output_v2/nature/trees/elegant-tree-0002.glb",
    "name": "Elegant Tree"
  },
  {
    "path": "output_v2/props/barrels/ancient-barrel-0002.glb",
    "name": "Ancient Barrel"
  },
  {
    "path": "output_v2/props/campfires/shadow-campfire-0000.glb",
    "name": "Shadow Campfire"
  },
  {
    "path": "output_v2/props/fences/ember-fence-0001.glb",
    "name": "Ember Fence"
  },
  {
    "path": "output_v2/props/wells/storm-well-0001.glb",
    "name": "Storm Well"
  },
  {
    "path": "output_v2/weapons/axes/mystic-axe-0002.glb",
    "name": "Mystic Axe"
  },
  {
    "path": "output_v2/weapons/hammers/storm-hammer-0002.glb",
    "name": "Storm Hammer"
  },
  {
    "path": "output_v2/weapons/shields/rustic-shield-0001.glb",
    "name": "Rustic Shield"
  },
  {
    "path": "output_v2/weapons/swords/frost-sword-0001.glb",
    "name": "Frost Sword"
  }
];

const loader=new GLTFLoader();
const grid=document.getElementById('grid');

for(const m of models){
  const card=document.createElement('div');card.className='card';
  const cvs=document.createElement('canvas');cvs.width=560;cvs.height=440;
  const label=document.createElement('div');label.className='label';label.textContent=m.name;
  card.append(cvs,label);grid.append(card);

  const renderer=new THREE.WebGLRenderer({canvas:cvs,antialias:true,alpha:true});
  renderer.setPixelRatio(2);renderer.setSize(280,220);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.2;
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0a0a1a);
  const cam=new THREE.PerspectiveCamera(40,280/220,0.01,100);
  cam.position.set(2,2,2);
  const ctrl=new OrbitControls(cam,cvs);ctrl.enableDamping=true;ctrl.autoRotate=true;ctrl.autoRotateSpeed=3;

  scene.add(new THREE.AmbientLight(0xffffff,0.5));
  const dl=new THREE.DirectionalLight(0xffffff,1.5);dl.position.set(3,5,3);scene.add(dl);
  const dl2=new THREE.DirectionalLight(0x4488ff,0.5);dl2.position.set(-3,2,-3);scene.add(dl2);
  const dl3=new THREE.DirectionalLight(0xff8844,0.3);dl3.position.set(0,-2,3);scene.add(dl3);

  loader.load(m.path,(gltf)=>{
    const obj=gltf.scene;
    const box=new THREE.Box3().setFromObject(obj);
    const size=box.getSize(new THREE.Vector3());
    const center=box.getCenter(new THREE.Vector3());
    const maxDim=Math.max(size.x,size.y,size.z);
    const scale=2/maxDim;
    obj.scale.setScalar(scale);
    obj.position.sub(center.multiplyScalar(scale));
    scene.add(obj);
    cam.position.set(2,1.5,2);cam.lookAt(0,0,0);
  },undefined,(err)=>{label.textContent+=' ❌';console.error(m.path,err);});

  function anim(){requestAnimationFrame(anim);ctrl.update();renderer.render(scene,cam);}
  anim();
}
</script></body></html>
