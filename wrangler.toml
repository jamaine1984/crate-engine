name = "crateship-games"
pages_build_output_dir = "dist"
compatibility_date = "2026-05-19"

[vars]
APP_ORIGIN = "https://crateshipgames.com"
STRIPE_MODE = "test"
STRIPE_DELIVERY_READY = "true"
# Local password signup (Resend mail) is unused: Firebase Authentication handles passwords and email.
AUTH_PASSWORD_POLICY_APPROVED = "false"
# Firebase project koko-engine-ai, web app "crateshipgames". Public web settings, not secrets.
# Firebase enforces a 12-128 character password policy; the server verifies ID tokens.
FIREBASE_PROJECT_ID = "koko-engine-ai"
FIREBASE_API_KEY = "AIzaSyD0qcMhW-S4QmL5jEEhUhnXG33ninxSdRo"
FIREBASE_AUTH_DOMAIN = "koko-engine-ai.firebaseapp.com"
FIREBASE_APP_ID = "1:868877477370:web:9eb29032ffac3105db7043"

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "crateship-platform-v1"
database_id = "be31584e-bd51-46b6-b935-a794097d2e12"
migrations_dir = "platform/migrations"

[[r2_buckets]]
binding = "ENGINE_ASSETS"
bucket_name = "crateship-games-user-assets"

[[r2_buckets]]
binding = "PLATFORM_UPLOADS"
bucket_name = "crateship-games-user-assets"

[[kv_namespaces]]
binding = "CRATE_GAMES"
id = "cfd1bca8ac84439cadc2bb146a034d41"

[[d1_databases]]
binding = "CRATE_AUDIT"
database_name = "crateship-games-audit"
database_id = "9cbee4e4-caa7-43fb-bbb7-9f0f7d7e2b9a"

[[r2_buckets]]
binding = "CRATE_USER_ASSETS"
bucket_name = "crateship-games-user-assets"
